name: Deploy Frontend

on:
  workflow_dispatch:

concurrency:
  group: microbooker-production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://microbooker.babakraeisi.com
    defaults:
      run:
        working-directory: MicroBooker.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MicroBooker.Client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build production client
        env:
          VITE_API_BASE_URL: https://api.microbooker.babakraeisi.com
          VITE_AUTH_BASE_URL: https://api.microbooker.babakraeisi.com
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload client to S3
        run: aws s3 sync dist/ s3://microbooker-client-frontend --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2B8B8WYIA918L --paths "/*"
