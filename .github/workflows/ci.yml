name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: .NET info
        run: dotnet --info

      - name: List root files
        run: ls -la

      - name: Restore
        run: dotnet restore MicroBooker.slnx

      - name: Build
        run: dotnet build MicroBooker.slnx --configuration Release --no-restore

  build-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MicroBooker.Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MicroBooker.Client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [build-dotnet]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: microbooker-api
            dockerfile: Reservation.Api/Dockerfile
            context: .
          - name: microbooker-worker
            dockerfile: MicroBooker.StorageWorker/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.name }}:latest -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push $ECR_REGISTRY/${{ matrix.name }}:latest
